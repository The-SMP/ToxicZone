prefix: "&8[&b極光毒圈&8] &r"
only-player: "&c此指令只能由玩家執行。"
no-permission: "&c你沒有權限執行此操作。"
help: |-
  &b&l毒圈管理 &8| &7指令列表
  &8&m--------------------------------
  &f/tz &8- &7開啟箱子控制面板
  &f/tz arena <create|use|list> &8- &7建立、切換或列出場地
  &e區域設定
  &f/tz status &8- &7查看目前狀態
  &f/tz center [世界 x z] &8- &7設定中心位置
  &f/tz wand &8- &7取得區域選取釣竿
  &f/tz radius <起始> [最小] &8- &7設定安全區半徑
  &f/tz time <秒數> &8- &7設定縮圈時間
  &f/tz damage <傷害> [間隔] &8- &7設定傷害與間隔

  &e縮圈控制
  &f/tz start &8/ &fstop &8- &7開始或停止縮圈
  &f/tz reload &8- &7重新載入設定
  &f/tz version &8- &7檢查插件版本
  &8&m--------------------------------
  &7管理指令需管理權限；版本檢查需版本權限。
